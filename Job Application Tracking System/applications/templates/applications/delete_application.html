
{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Delete Job Application</title>
    <link rel="stylesheet" href="{% static 'applications/style.css' %}">
</head>
<body>

    <div class="container">

        <h1>Delete Job Application</h1>

        <p>Are you sure you want to delete this application?</p>

        <h3>{{ application.company_name }}</h3>
        <p>{{ application.job_role }}</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit">Yes, Delete</button>
        </form>

        <br>

        <a href="{% url 'application_list' %}">Cancel</a>

    </div>

</body>
</html>
